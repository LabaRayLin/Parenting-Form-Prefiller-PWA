name: Hourly Calendar & FB Closure Sync

on:
  schedule:
    # Runs hourly on the hour (Taiwan time: 00:00, 01:00, etc.)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-announcements:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Run Announcement & Closure Updater
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_API_VERSION: ${{ vars.FB_GRAPH_API_VERSION || 'v22.0' }}
        run: |
          python scripts/update_announcements.py

      - name: Commit and push if changes detected
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/announcements.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): auto-update monthly calendar & FB closure announcements [skip ci]" && git push)
