<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>楊梅四維親子館 ‧ 入館登記預填助手</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="楊梅四維親子館快速入館登記表預填連結產生器。一鍵選擇情境自動生成已填妥資料的 Google 表單連結，省去重複填寫時間。">
  <meta name="theme-color" content="#6D58FF">
  
  <!-- PWA & Apple Standalone Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="四維親子館">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Header -->
    <header>
      <div class="logo-section">
        <img src="./icons/icon-192.png" alt="App Logo" class="app-icon-img">
        <div class="logo-text">
          <h1>四維親子館登記助手</h1>
          <p>Google 表單預填連結產生器</p>
        </div>
      </div>
      <button class="btn-settings-trigger" id="settingsTrigger" title="家庭設定">
        ⚙️
      </button>
    </header>

    <!-- Main Content -->
    <main>
      
      <!-- Top Pinned Notice / Info Card -->
      <section class="top-pinned-notice">
        <div class="notice-schedule">
          <span class="notice-icon">⏰</span>
          <div class="notice-schedule-text">
            <span class="notice-label">館舍開放時間</span>
            <span class="notice-value">週二 - 週日 09:00-12:00，14:00-17:00</span>
          </div>
        </div>
        <div class="notice-divider"></div>
        <div class="notice-links-row">
          <a href="#" target="_blank" rel="noopener noreferrer" class="notice-news-link" id="monthlyCalendarLink">
            <div class="notice-news-left">
              <span class="notice-icon">📅</span>
              <span class="notice-news-title">最新消息</span>
            </div>
            <span class="notice-link-btn">
              <span id="calendarLinkText">本月活動行事曆</span> <span class="arrow">↗</span>
            </span>
          </a>
          <a href="https://www.facebook.com/ymswpcc/photos?locale=zh_TW" target="_blank" rel="noopener noreferrer" class="notice-fb-sublink" title="前往四維親子館 FB 粉專">
            <span>FB</span> ↗
          </a>
        </div>
      </section>

      <!-- Profile Dashboard Summary -->
      <section class="card" id="profileSummaryCard">
        <div class="profile-summary-header">
          <div class="profile-summary-title">
            <span>🏠</span> 目前家庭設定
          </div>
          <span class="badge-profile-status">已啟用</span>
        </div>
        <div class="profile-summary-details" id="profileSummaryContent">
          <!-- Dynamically populated by app.js -->
          <div style="text-align: center; padding: 10px 0;">載入設定中...</div>
        </div>
      </section>

      <!-- Scenarios Grid -->
      <section>
        <div class="section-title">
          <span>✨</span> 選擇今天入館情境
        </div>
        <div class="scenarios-grid">
          
          <button class="btn-scenario dad" onclick="runDadScenario()">
            <div class="icon">👨‍👦</div>
            <div class="label">爸爸帶小孩</div>
            <div class="sublabel">1 位男家長</div>
          </button>
          
          <button class="btn-scenario mom" onclick="runMomScenario()">
            <div class="icon">👩‍👦</div>
            <div class="label">媽媽帶小孩</div>
            <div class="sublabel">1 位女家長</div>
          </button>
          
          <button class="btn-scenario both" onclick="runBothScenario()">
            <div class="icon">👨‍👩‍👧‍👦</div>
            <div class="label">父母都去</div>
            <div class="sublabel">2 位大人入館</div>
          </button>
          
          <button class="btn-scenario grandma" onclick="runGrandmaScenario()">
            <div class="icon">👵‍👦</div>
            <div class="label">奶奶帶小孩</div>
            <div class="sublabel">1 位女性長輩</div>
          </button>

          <button class="btn-scenario grandpa" onclick="runGrandpaScenario()">
            <div class="icon">👴‍👦</div>
            <div class="label">爺爺帶小孩</div>
            <div class="sublabel">1 位男性長輩</div>
          </button>

          <button class="btn-scenario grandBoth" onclick="runGrandBothScenario()">
            <div class="icon">👵👴</div>
            <div class="label">爺奶都去</div>
            <div class="sublabel">2 位長輩入館</div>
          </button>
          
        </div>
      </section>

    </main>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-content">
        
        <div class="modal-header">
          <h2>⚙️ 家庭基本設定</h2>
          <button class="btn-modal-close" id="settingsClose">✕</button>
        </div>
        
        <form id="settingsForm">
          
          <!-- First time visited toggle -->
          <div class="toggle-wrapper" style="margin-bottom: 12px;">
            <span class="form-label">第一次來楊梅四維親子館？</span>
            <label class="switch">
              <input type="checkbox" id="firstTime">
              <span class="slider"></span>
            </label>
          </div>

          <!-- Parents details -->
          <div class="form-group">
            <span class="form-label">👨 爸爸資料</span>
            <div class="form-row">
              <input type="text" id="dadName" placeholder="姓名（如：張大寶）">
              <input type="text" id="dadPhone" placeholder="電話（如：0912...）" inputmode="tel">
            </div>
          </div>
          
          <div class="form-group" style="margin-top: 12px;">
            <span class="form-label">👩 媽媽資料</span>
            <div class="form-row">
              <input type="text" id="momName" placeholder="姓名（如：王小美）">
              <input type="text" id="momPhone" placeholder="電話（如：0987...）" inputmode="tel">
            </div>
          </div>

          <!-- Parents phone combine settings -->
          <div class="form-group" style="margin-top: 12px;">
            <label class="form-label" for="bothPhoneMode">父母共同入館時的聯絡電話</label>
            <select id="bothPhoneMode">
              <option value="dad">使用「爸爸的電話」</option>
              <option value="mom">使用「媽媽的電話」</option>
            </select>
          </div>
          
          <!-- Grandparents details -->
          <div class="form-group" style="margin-top: 12px; border-top: 1px dashed var(--border-light); padding-top: 12px;">
            <span class="form-label">👴 爺爺資料</span>
            <div class="form-row">
              <input type="text" id="grandpaName" placeholder="姓名（如：張爺爺）">
              <input type="text" id="grandpaPhone" placeholder="電話（如：0910...）" inputmode="tel">
            </div>
          </div>

          <div class="form-group" style="margin-top: 12px;">
            <span class="form-label">👵 奶奶資料</span>
            <div class="form-row">
              <input type="text" id="grandmaName" placeholder="姓名（如：李奶奶）">
              <input type="text" id="grandmaPhone" placeholder="電話（如：0920...）" inputmode="tel">
            </div>
          </div>

          <!-- Grandparents phone combine settings -->
          <div class="form-group" style="margin-top: 12px;">
            <label class="form-label" for="grandBothPhoneMode">爺奶共同入館時的聯絡電話</label>
            <select id="grandBothPhoneMode">
              <option value="grandma">使用「奶奶的電話」</option>
              <option value="grandpa">使用「爺爺的電話」</option>
            </select>
          </div>

          <!-- Address -->
          <div class="form-group" style="margin-top: 12px; border-top: 1px dashed var(--border-light); padding-top: 12px;">
            <label class="form-label" for="district">📍 桃園市居住地區</label>
            <select id="district">
              <option value="楊梅區">楊梅區</option>
              <!-- Populated dynamically -->
            </select>
          </div>
          
          <div class="form-group" id="villageGroup" style="margin-top: 10px; display: flex;">
            <label class="form-label" for="village">🏡 楊梅區居住里別</label>
            <select id="village">
              <!-- Populated dynamically -->
            </select>
          </div>

          <!-- Children settings -->
          <div style="margin-top: 16px; border-top: 1px dashed var(--border-light); padding-top: 12px;">
            <div class="children-section-header">
              <span class="form-label">👶 幼兒資料管理</span>
              <button type="button" class="btn-add-child" id="btnAddChild">
                ＋ 新增孩子
              </button>
            </div>
            
            <div class="children-list" id="childrenContainer">
              <!-- Populated dynamically -->
            </div>
          </div>

          <button type="submit" class="btn-save-settings">
            💾 儲存家庭設定
          </button>
        </form>
        
      </div>
    </div>

    <!-- Redirect Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">正在生成表單，跳轉中...</div>
      <div class="helper-text">預填已填妥 100% 資料，入館前直接提交即可！</div>
    </div>

  </div>

  <script src="./app.js"></script>
</body>
</html>
